<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Guru</title>
<style>
  :root {
    --bg: #f5f6f4;
    --surface: #ffffff;
    --ink: #1d2420;
    --muted: #66706a;
    --line: #dfe3df;
    --brand: #1f6b4f;
    --brand-ink: #ffffff;
    --brand-soft: #e6f1ec;
    --danger: #b3261e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px;
    background: var(--brand); color: var(--brand-ink);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand strong { font-size: 17px; }
  .brand span { opacity: .8; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .topbar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); color: #fff; }
  .topbar .btn.primary { background: #fff; color: var(--brand); border-color: #fff; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { filter: brightness(.97); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 4px 10px; font-size: 13px; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; max-width: 1150px; margin: 0 auto; padding: 20px 16px 60px; }
  .nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 76px; align-self: start; }
  .nav button {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer;
  }
  .nav button:hover { background: #eaede9; }
  .nav button.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .nav .count { font-size: 12px; color: var(--muted); background: #e9ece8; border-radius: 99px; padding: 1px 8px; font-weight: 500; }
  .nav button.active .count { background: #fff; color: var(--brand); }

  main { min-width: 0; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 22px; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; }

  /* ---------- Forms ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; color: #3d4741; }
  .field label .req { color: var(--danger); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #cfd5d0; border-radius: 8px; background: #fff;
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }
  .hint { font-size: 12px; color: var(--muted); }

  .profile-wrap { display: grid; grid-template-columns: 140px 1fr; gap: 20px; }
  .avatar {
    width: 140px; height: 170px; border-radius: 8px; border: 1px dashed #b9c1bb; background: #f0f2ef;
    display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-size: 13px; text-align: center;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  /* ---------- Summary ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .n { font-size: 22px; font-weight: 700; color: var(--brand); }
  .stat .l { font-size: 13px; color: var(--muted); }

  /* ---------- Entries ---------- */
  .entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .entry-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .entry h3 { margin: 0; font-size: 15.5px; }
  .entry .meta { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .entry .note { margin-top: 6px; font-size: 14px; white-space: pre-wrap; }
  .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-weight: 600; margin-left: 6px; vertical-align: middle; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; border: 1px dashed #c6cdc8; border-radius: var(--radius); }

  /* ---------- Dialog ---------- */
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog::backdrop { background: rgba(20, 28, 24, .45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 17px; }
  .dlg-body { padding: 16px 18px; overflow: auto; max-height: calc(100vh - 160px); }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .icon-btn { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }

  .photo-edit { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .photo-edit .ph { position: relative; width: 96px; height: 96px; }
  .photo-edit .ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .photo-edit .ph button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; cursor: pointer; font-size: 14px; line-height: 22px; padding: 0; }
  .photo-add { width: 96px; height: 96px; border: 1px dashed #b9c1bb; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; background: #f6f7f5; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; padding: 16px; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: #1d2420; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .print-view { display: none; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; padding-top: 12px; }
    .nav { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .nav button { flex-shrink: 0; }
    .grid { grid-template-columns: 1fr; }
    .profile-wrap { grid-template-columns: 1fr; }
  }

  /* ---------- Print / PDF ---------- */
  @page { size: A4; margin: 16mm 14mm; }
  @media print {
    body { background: #fff; font-size: 11pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body > *:not(.print-view) { display: none !important; }
    .print-view { display: block; }

    .p-cover { height: 255mm; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; break-after: page; border: 2px solid var(--brand); border-radius: 6px; }
    .p-cover .eyebrow { letter-spacing: .2em; font-size: 12pt; color: var(--brand); font-weight: 700; }
    .p-cover h1 { font-size: 30pt; margin: 6mm 0 2mm; }
    .p-cover .year { font-size: 22pt; color: var(--brand); font-weight: 700; }
    .p-cover img { width: 45mm; height: 55mm; object-fit: cover; border-radius: 4px; margin: 14mm 0 8mm; border: 1px solid var(--line); }
    .p-cover .nobox { height: 20mm; }
    .p-cover .name { font-size: 16pt; font-weight: 700; }
    .p-cover .sub { font-size: 12pt; color: #444; margin-top: 2mm; }

    .p-sec { break-before: page; }
    .p-sec:first-of-type { break-before: auto; }
    .p-sec h2 { font-size: 15pt; color: var(--brand); border-bottom: 2px solid var(--brand); padding-bottom: 2mm; margin: 0 0 5mm; }
    .p-sec h3.sub { font-size: 12pt; margin: 6mm 0 3mm; }

    .p-table { width: 100%; border-collapse: collapse; }
    .p-table th, .p-table td { border: 1px solid #c9cfca; padding: 2mm 3mm; text-align: left; vertical-align: top; }
    .p-table th { background: var(--brand-soft); width: 38%; }
    .p-table.wide-th th { width: auto; }

    .p-entry { border: 1px solid #c9cfca; border-radius: 4px; padding: 4mm; margin-bottom: 5mm; break-inside: avoid; }
    .p-entry h4 { margin: 0 0 2mm; font-size: 12pt; }
    .p-entry h4 .no { color: var(--brand); margin-right: 2mm; }
    .p-entry dl { display: grid; grid-template-columns: 34mm 1fr; gap: 1mm 3mm; margin: 0; }
    .p-entry dt { color: #555; }
    .p-entry dd { margin: 0; white-space: pre-wrap; }
    .p-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 3mm; }
    .p-photos img { width: 100%; height: 60mm; object-fit: contain; background: #f2f3f1; border: 1px solid #ddd; border-radius: 3px; }
    .p-none { color: #777; font-style: italic; }
    .p-total { margin: 0 0 5mm; padding: 3mm 4mm; background: var(--brand-soft); border-radius: 4px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><strong>Portfolio Guru</strong><span id="hdrYear"></span></div>
  <div class="actions">
    <button class="btn primary" id="btnPrint" type="button">Cetak / Simpan PDF</button>
    <button class="btn" id="btnExport" type="button">Muat turun sandaran</button>
    <button class="btn" id="btnImport" type="button">Pulih sandaran</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>
</header>

<div class="layout">
  <nav class="nav" id="nav" aria-label="Bahagian"></nav>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form id="entryForm" novalidate>
    <div class="dlg-head">
      <h2 id="dlgTitle">Tambah rekod</h2>
      <button type="button" class="icon-btn" data-close aria-label="Tutup">×</button>
    </div>
    <div class="dlg-body">
      <div class="grid" id="dlgFields"></div>
      <div class="field wide" style="margin-top:14px">
        <label>Gambar (maksimum <span id="maxPh"></span>)</label>
        <div class="photo-edit" id="dlgPhotos"></div>
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
        <span class="hint">Gambar dikecilkan secara automatik supaya ringan.</span>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-close>Batal</button>
      <button type="submit" class="btn primary">Simpan</button>
    </div>
  </form>
</dialog>

<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast" role="status"></div>
<div class="print-view" id="printView"></div>

<script>
(() => {
  'use strict';

  // ================= Konfigurasi =================
  const MAX_PHOTOS = 4;
  const PERINGKAT = ['Sekolah', 'Daerah', 'Negeri', 'Kebangsaan', 'Antarabangsa'];

  const F = {
    tarikh:      { k: 'tarikh', l: 'Tarikh mula', t: 'date' },
    tarikhAkhir: { k: 'tarikhAkhir', l: 'Tarikh tamat', t: 'date', hint: 'Kosongkan jika sehari / masih berjalan' },
    peringkat:   { k: 'peringkat', l: 'Peringkat', t: 'select', o: PERINGKAT },
    catatan:     { k: 'catatan', l: 'Catatan / huraian', t: 'textarea', wide: true },
  };

  const SECTIONS = [
    { id: 'pengurusan', title: 'Pengurusan', desc: 'Tugas dan jawatan pengurusan atau pentadbiran yang dipegang.',
      titleKey: 'tugas', fields: [
        { k: 'tugas', l: 'Tugas / jawatan', req: true, wide: true, ph: 'cth: Setiausaha Peperiksaan' },
        F.tarikh, F.tarikhAkhir, F.peringkat, F.catatan ] },
    { id: 'kokurikulum', title: 'Kokurikulum', desc: 'Kelab, persatuan, sukan dan badan beruniform.',
      titleKey: 'namaUnit', fields: [
        { k: 'kategori', l: 'Kategori', t: 'select', o: ['Kelab & Persatuan', 'Sukan & Permainan', 'Badan Beruniform', 'Lain-lain'] },
        { k: 'namaUnit', l: 'Nama unit / aktiviti', req: true, ph: 'cth: Kelab Sains' },
        { k: 'jawatan', l: 'Jawatan', ph: 'cth: Guru Penasihat' },
        F.peringkat,
        { k: 'pencapaian', l: 'Pencapaian', wide: true, ph: 'cth: Johan Pertandingan Roket Air Peringkat Daerah' },
        F.tarikh, F.tarikhAkhir, F.catatan ] },
    { id: 'kursus', title: 'Kursus', desc: 'Kursus, bengkel dan latihan, sama ada sebagai peserta atau penceramah.',
      titleKey: 'nama', fields: [
        { k: 'nama', l: 'Nama kursus', req: true, wide: true },
        { k: 'penganjur', l: 'Penganjur', req: true },
        { k: 'peranan', l: 'Peranan', t: 'select', o: ['Peserta', 'Penceramah'], req: true },
        { k: 'jam', l: 'Bilangan jam', t: 'number', req: true, step: '0.5' },
        F.peringkat, F.tarikh, F.tarikhAkhir, F.catatan ] },
    { id: 'organisasi', title: 'Keterlibatan Dengan Organisasi', desc: 'Persatuan, NGO, badan profesional atau komuniti di luar sekolah.',
      titleKey: 'namaOrg', fields: [
        { k: 'namaOrg', l: 'Nama organisasi', req: true, wide: true },
        { k: 'jawatan', l: 'Jawatan / peranan' },
        F.peringkat, F.tarikh, F.tarikhAkhir, F.catatan ] },
    { id: 'kelabGuru', title: 'Program Kelab Guru ILMI', desc: 'Program anjuran Kelab Guru ILMI.',
      titleKey: 'namaProgram', fields: [
        { k: 'namaProgram', l: 'Nama program', req: true, wide: true },
        { k: 'peranan', l: 'Peranan', ph: 'cth: AJK Teknikal' },
        F.tarikh, F.tarikhAkhir, F.catatan ] },
    { id: 'programSekolah', title: 'Program Sekolah', desc: 'Program peringkat sekolah dan jawatan yang disandang.',
      titleKey: 'namaProgram', fields: [
        { k: 'namaProgram', l: 'Nama program', req: true, wide: true },
        { k: 'jawatan', l: 'Jawatan disandang', req: true, ph: 'cth: Pengarah Program' },
        F.tarikh, F.tarikhAkhir, F.catatan ] },
  ];

  const PROFILE_FIELDS = [
    { k: 'nama', l: 'Nama penuh', req: true, wide: true },
    { k: 'idStaf', l: 'ID staf', req: true },
    { k: 'bidang', l: 'Bidang', t: 'select', o: ['Akademik', 'Diniah'], req: true },
    { k: 'entiti', l: 'Entiti', req: true },
    { k: 'jawatan', l: 'Jawatan', req: true, ph: 'cth: Guru Akademik' },
    { k: 'mataPelajaran', l: 'Mata pelajaran diajar', ph: 'cth: Matematik, Sains' },
    { k: 'tahun', l: 'Tahun portfolio', t: 'number' },
  ];

  const DEFAULT_STATE = () => ({
    profile: { nama: '', idStaf: '', bidang: '', entiti: 'SMA ILMI', jawatan: '', mataPelajaran: '', tahun: '2026', photo: null },
    entries: Object.fromEntries(SECTIONS.map(s => [s.id, []])),
  });

  // ================= Storan (IndexedDB) =================
  const DB = {
    db: null,
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('portfolio-guru', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('photos'); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => rej(r.error);
      });
    },
    run(store, mode, fn) {
      return new Promise((res, rej) => {
        const t = this.db.transaction(store, mode);
        const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req ? req.result : undefined);
        t.onerror = t.onabort = () => rej(t.error);
      });
    },
    get: (s, k) => DB.run(s, 'readonly', o => o.get(k)),
    put: (s, k, v) => DB.run(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => DB.run(s, 'readwrite', o => o.delete(k)),
    clear: (s) => DB.run(s, 'readwrite', o => o.clear()),
    all(store) {
      return new Promise((res, rej) => {
        const out = {};
        const t = this.db.transaction(store, 'readonly');
        const c = t.objectStore(store).openCursor();
        c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
      });
    },
  };

  let state = DEFAULT_STATE();
  let photos = {};            // id -> dataURL
  let view = 'profil';

  const saveState = () => DB.put('kv', 'state', state).catch(err => toast('Gagal simpan: ' + err.message));

  // ================= Utiliti =================
  const $ = (s, el = document) => el.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
  const fmtRange = (a, b) => a && b && a !== b ? `${fmtDate(a)} – ${fmtDate(b)}` : fmtDate(a || b);
  const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  const fmtNum = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
  const sorted = list => [...list].sort((a, b) => (a.tarikh || '9999').localeCompare(b.tarikh || '9999'));
  const section = id => SECTIONS.find(s => s.id === id);

  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function compressImage(file, max = 1400, quality = 0.78) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(`Tidak dapat membaca "${file.name}"`)); };
      img.src = url;
    });
  }

  function fieldInput(f, value, prefix = '') {
    const id = prefix + f.k;
    const req = f.req ? ' required' : '';
    let input;
    if (f.t === 'select') {
      input = `<select id="${id}" name="${f.k}"${req}><option value="">— Pilih —</option>${
        f.o.map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    } else if (f.t === 'textarea') {
      input = `<textarea id="${id}" name="${f.k}"${req}>${esc(value)}</textarea>`;
    } else {
      input = `<input id="${id}" name="${f.k}" type="${f.t || 'text'}" value="${esc(value)}"${
        f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${f.step ? ` step="${f.step}" min="0"` : ''}${req}>`;
    }
    return `<div class="field${f.wide ? ' wide' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>${input}${
      f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
  }

  function kursusTotals() {
    const t = { semua: 0, peserta: 0, penceramah: 0 };
    for (const e of state.entries.kursus) {
      const j = num(e.jam); t.semua += j;
      if (e.peranan === 'Penceramah') t.penceramah += j; else t.peserta += j;
    }
    return t;
  }

  // ================= Navigasi =================
  function renderNav() {
    const items = [{ id: 'profil', title: 'Profil & Ringkasan' }, ...SECTIONS];
    $('#nav').innerHTML = items.map(s => {
      const n = s.id === 'profil' ? '' : `<span class="count">${state.entries[s.id].length}</span>`;
      return `<button type="button" data-view="${s.id}" class="${view === s.id ? 'active' : ''}"><span>${esc(s.title)}</span>${n}</button>`;
    }).join('');
    $('#hdrYear').textContent = state.profile.tahun || '';
    document.title = `Portfolio Guru ${state.profile.tahun || ''}`.trim();
  }

  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]'); if (!b) return;
    view = b.dataset.view; render(); window.scrollTo({ top: 0 });
  });

  function render() { renderNav(); view === 'profil' ? renderProfile() : renderSection(section(view)); }

  // ================= Profil =================
  function renderProfile() {
    const p = state.profile;
    const t = kursusTotals();
    const photo = p.photo && photos[p.photo];
    $('#main').innerHTML = `
      <div class="page-head"><div><h1>Profil Guru</h1><p>Maklumat ini dipaparkan di muka depan dan halaman pertama portfolio.</p></div></div>
      <div class="card">
        <div class="profile-wrap">
          <div>
            <div class="avatar">${photo ? `<img src="${photo}" alt="Gambar profil">` : 'Tiada gambar profil'}</div>
            <div class="avatar-actions">
              <button type="button" class="btn small" id="btnAvatar">${photo ? 'Tukar' : 'Muat naik'}</button>
              ${photo ? '<button type="button" class="btn small danger" id="btnAvatarDel">Buang</button>' : ''}
            </div>
            <input type="file" id="avatarInput" accept="image/*" hidden>
          </div>
          <form class="grid" id="profileForm" autocomplete="off">
            ${PROFILE_FIELDS.map(f => fieldInput(f, p[f.k], 'p_')).join('')}
            <span class="hint field wide">Disimpan secara automatik dalam pelayar ini.</span>
          </form>
        </div>
      </div>
      <div class="card">
        <h2>Ringkasan ${esc(p.tahun)}</h2>
        <div class="stats">
          ${SECTIONS.map(s => `<div class="stat"><div class="n">${state.entries[s.id].length}</div><div class="l">${esc(s.title)}</div></div>`).join('')}
          <div class="stat"><div class="n">${fmtNum(t.semua)}</div><div class="l">Jumlah jam kursus</div></div>
          <div class="stat"><div class="n">${fmtNum(t.peserta)}</div><div class="l">Jam sebagai peserta</div></div>
          <div class="stat"><div class="n">${fmtNum(t.penceramah)}</div><div class="l">Jam sebagai penceramah</div></div>
        </div>
      </div>`;

    let timer;
    $('#profileForm').addEventListener('input', e => {
      const k = e.target.name; if (!k) return;
      state.profile[k] = e.target.value;
      if (k === 'tahun') renderNav();
      clearTimeout(timer); timer = setTimeout(saveState, 300);
    });
    $('#btnAvatar').onclick = () => $('#avatarInput').click();
    $('#avatarInput').onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const data = await compressImage(file, 800, 0.85);
        const id = uid();
        await DB.put('photos', id, data);
        if (p.photo) { await DB.del('photos', p.photo); delete photos[p.photo]; }
        photos[id] = data; p.photo = id; await saveState(); renderProfile();
      } catch (err) { toast(err.message); }
    };
    const del = $('#btnAvatarDel');
    if (del) del.onclick = async () => {
      await DB.del('photos', p.photo); delete photos[p.photo]; p.photo = null; await saveState(); renderProfile();
    };
  }

  // ================= Bahagian =================
  function entryMeta(s, e) {
    const parts = [];
    for (const f of s.fields) {
      if (f.k === s.titleKey || f.k === 'catatan' || f.k === 'tarikh' || f.k === 'tarikhAkhir' || f.k === 'peranan' && s.id === 'kursus') continue;
      if (!e[f.k]) continue;
      parts.push(f.k === 'jam' ? `${e.jam} jam` : e[f.k]);
    }
    const date = fmtRange(e.tarikh, e.tarikhAkhir);
    if (date) parts.unshift(date);
    return parts.map(esc).join(' · ');
  }

  function renderSection(s) {
    const list = sorted(state.entries[s.id]);
    let extra = '';
    if (s.id === 'kursus' && list.length) {
      const t = kursusTotals();
      extra = `<div class="card stats" style="padding:12px">
        <div class="stat"><div class="n">${fmtNum(t.semua)}</div><div class="l">Jumlah jam</div></div>
        <div class="stat"><div class="n">${fmtNum(t.peserta)}</div><div class="l">Peserta</div></div>
        <div class="stat"><div class="n">${fmtNum(t.penceramah)}</div><div class="l">Penceramah</div></div></div>`;
    }
    $('#main').innerHTML = `
      <div class="page-head">
        <div><h1>${esc(s.title)}</h1><p>${esc(s.desc)}</p></div>
        <button type="button" class="btn primary" id="btnAdd">+ Tambah rekod</button>
      </div>
      ${extra}
      ${list.length ? list.map(e => `
        <article class="entry">
          <div class="entry-top">
            <div>
              <h3>${esc(e[s.titleKey])}${s.id === 'kursus' && e.peranan ? `<span class="tag">${esc(e.peranan)}</span>` : ''}</h3>
              <div class="meta">${entryMeta(s, e)}</div>
            </div>
            <div class="entry-actions">
              <button type="button" class="btn small" data-edit="${e.id}">Edit</button>
              <button type="button" class="btn small danger" data-del="${e.id}">Padam</button>
            </div>
          </div>
          ${e.catatan ? `<div class="note">${esc(e.catatan)}</div>` : ''}
          ${(e.photos || []).length ? `<div class="thumbs">${e.photos.filter(id => photos[id]).map(id => `<img src="${photos[id]}" alt="" data-zoom>`).join('')}</div>` : ''}
        </article>`).join('')
      : `<div class="empty">Belum ada rekod untuk bahagian ini.<br><br><button type="button" class="btn primary" id="btnAdd2">+ Tambah rekod pertama</button></div>`}`;

    $('#btnAdd').onclick = () => openEntry(s);
    const b2 = $('#btnAdd2'); if (b2) b2.onclick = () => openEntry(s);
  }

  $('#main').addEventListener('click', async e => {
    const s = section(view); if (!s) return;
    const edit = e.target.closest('[data-edit]');
    const del = e.target.closest('[data-del]');
    const zoom = e.target.closest('[data-zoom]');
    if (edit) openEntry(s, state.entries[s.id].find(x => x.id === edit.dataset.edit));
    if (del) {
      const entry = state.entries[s.id].find(x => x.id === del.dataset.del);
      if (!confirm(`Padam rekod "${entry[s.titleKey]}"? Tindakan ini tidak boleh dibatalkan.`)) return;
      for (const id of entry.photos || []) { await DB.del('photos', id); delete photos[id]; }
      state.entries[s.id] = state.entries[s.id].filter(x => x !== entry);
      await saveState(); render(); toast('Rekod dipadam');
    }
    if (zoom) { $('#lightbox img').src = zoom.src; $('#lightbox').classList.add('show'); }
  });
  $('#lightbox').onclick = () => $('#lightbox').classList.remove('show');

  // ================= Dialog rekod =================
  const dlg = $('#dlg');
  let editing = null;   // { s, entry, photos: [{id, data, isNew}], removed: [] }

  function openEntry(s, entry = null) {
    editing = {
      s, entry,
      photos: (entry?.photos || []).filter(id => photos[id]).map(id => ({ id, data: photos[id], isNew: false })),
      removed: [],
    };
    $('#dlgTitle').textContent = `${entry ? 'Edit' : 'Tambah'} rekod · ${s.title}`;
    $('#dlgFields').innerHTML = s.fields.map(f => fieldInput(f, entry?.[f.k] ?? '', 'e_')).join('');
    $('#maxPh').textContent = MAX_PHOTOS;
    renderDlgPhotos();
    dlg.showModal();
    const first = $('#dlgFields input, #dlgFields select'); if (first) first.focus();
  }

  function renderDlgPhotos() {
    const list = editing.photos;
    $('#dlgPhotos').innerHTML = list.map((p, i) =>
      `<div class="ph"><img src="${p.data}" alt=""><button type="button" data-rm="${i}" aria-label="Buang gambar">×</button></div>`).join('') +
      (list.length < MAX_PHOTOS ? `<div class="photo-add" id="photoAdd" role="button" tabindex="0">+ Tambah<br>gambar</div>` : '');
  }

  $('#dlgPhotos').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      const [p] = editing.photos.splice(+rm.dataset.rm, 1);
      if (!p.isNew) editing.removed.push(p.id);
      renderDlgPhotos();
    } else if (e.target.closest('#photoAdd')) $('#photoInput').click();
  });
  $('#dlgPhotos').addEventListener('keydown', e => { if (e.target.id === 'photoAdd' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#photoInput').click(); } });

  $('#photoInput').addEventListener('change', async e => {
    const files = [...e.target.files]; e.target.value = '';
    const room = MAX_PHOTOS - editing.photos.length;
    if (files.length > room) toast(`Hanya ${room} gambar lagi boleh ditambah`);
    for (const file of files.slice(0, room)) {
      try { editing.photos.push({ id: uid(), data: await compressImage(file), isNew: true }); }
      catch (err) { toast(err.message); }
    }
    renderDlgPhotos();
  });

  dlg.addEventListener('click', e => { if (e.target.closest('[data-close]')) dlg.close(); });

  $('#entryForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const missing = editing.s.fields.find(f => f.req && !String(form.elements[f.k].value).trim());
    if (missing) { toast(`Sila isi "${missing.l}"`); form.elements[missing.k].focus(); return; }
    const t1 = form.elements.tarikh?.value, t2 = form.elements.tarikhAkhir?.value;
    if (t1 && t2 && t2 < t1) { toast('Tarikh tamat lebih awal daripada tarikh mula'); form.elements.tarikhAkhir.focus(); return; }

    const { s, entry } = editing;
    const data = { id: entry?.id || uid() };
    for (const f of s.fields) data[f.k] = form.elements[f.k].value.trim();

    try {
      for (const p of editing.photos.filter(p => p.isNew)) { await DB.put('photos', p.id, p.data); photos[p.id] = p.data; }
      for (const id of editing.removed) { await DB.del('photos', id); delete photos[id]; }
    } catch (err) { toast('Gagal simpan gambar: ' + err.message); return; }
    data.photos = editing.photos.map(p => p.id);

    const list = state.entries[s.id];
    if (entry) list[list.indexOf(entry)] = data; else list.push(data);
    await saveState();
    dlg.close(); render(); toast('Rekod disimpan');
  });

  // ================= Cetak / PDF =================
  function buildPrint() {
    const p = state.profile;
    const t = kursusTotals();
    const photo = p.photo && photos[p.photo];
    const row = (l, v) => `<tr><th>${esc(l)}</th><td>${esc(v || '—')}</td></tr>`;

    let html = `
      <section class="p-cover">
        <div class="eyebrow">PORTFOLIO GURU</div>
        <h1>${esc(p.entiti || '')}</h1>
        <div class="year">${esc(p.tahun || '')}</div>
        ${photo ? `<img src="${photo}" alt="">` : '<div class="nobox"></div>'}
        <div class="name">${esc(p.nama || '')}</div>
        <div class="sub">${esc(p.jawatan || '')}${p.bidang ? ' · ' + esc(p.bidang) : ''}</div>
        <div class="sub">ID Staf: ${esc(p.idStaf || '—')}</div>
      </section>
      <section class="p-sec">
        <h2>Maklumat Peribadi</h2>
        <table class="p-table">
          ${PROFILE_FIELDS.map(f => row(f.l, p[f.k])).join('')}
        </table>
        <h3 class="sub">Ringkasan</h3>
        <table class="p-table">
          ${SECTIONS.map(s => row(s.title, `${state.entries[s.id].length} rekod`)).join('')}
          ${row('Jumlah jam kursus', `${fmtNum(t.semua)} jam (Peserta: ${fmtNum(t.peserta)}, Penceramah: ${fmtNum(t.penceramah)})`)}
        </table>
      </section>`;

    SECTIONS.forEach((s, i) => {
      const list = sorted(state.entries[s.id]);
      html += `<section class="p-sec"><h2>${i + 1}. ${esc(s.title)}</h2>`;
      if (s.id === 'kursus' && list.length) {
        html += `<div class="p-total"><strong>Jumlah jam: ${fmtNum(t.semua)}</strong> &nbsp;·&nbsp; Peserta: ${fmtNum(t.peserta)} jam &nbsp;·&nbsp; Penceramah: ${fmtNum(t.penceramah)} jam</div>`;
      }
      if (!list.length) html += '<p class="p-none">Tiada rekod.</p>';
      list.forEach((e, n) => {
        const rows = [];
        const date = fmtRange(e.tarikh, e.tarikhAkhir);
        if (date) rows.push(['Tarikh', date]);
        for (const f of s.fields) {
          if (f.k === s.titleKey || f.k === 'tarikh' || f.k === 'tarikhAkhir' || !e[f.k]) continue;
          rows.push([f.l, f.k === 'jam' ? `${e.jam} jam` : e[f.k]]);
        }
        const ph = (e.photos || []).filter(id => photos[id]);
        html += `<div class="p-entry">
          <h4><span class="no">${n + 1}.</span>${esc(e[s.titleKey])}</h4>
          <dl>${rows.map(([l, v]) => `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
          ${ph.length ? `<div class="p-photos">${ph.map(id => `<img src="${photos[id]}" alt="">`).join('')}</div>` : ''}
        </div>`;
      });
      html += '</section>';
    });
    $('#printView').innerHTML = html;
  }

  $('#btnPrint').onclick = async () => {
    buildPrint();
    await Promise.all([...$('#printView').querySelectorAll('img')].map(img => img.decode().catch(() => {})));
    window.print();
  };

  // ================= Sandaran =================
  $('#btnExport').onclick = () => {
    const payload = { app: 'portfolio-guru', version: 1, exportedAt: new Date().toISOString(), state, photos };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    a.href = URL.createObjectURL(blob);
    a.download = `portfolio-guru-${state.profile.tahun || ''}-${d}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Sandaran dimuat turun');
  };

  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (data.app !== 'portfolio-guru' || !data.state?.profile || !data.state?.entries) throw new Error('Fail ini bukan sandaran Portfolio Guru');
      if (!confirm('Pulih sandaran akan MENGGANTIKAN semua data semasa. Teruskan?')) return;
      const fresh = DEFAULT_STATE();
      state = { profile: { ...fresh.profile, ...data.state.profile }, entries: { ...fresh.entries, ...data.state.entries } };
      photos = data.photos || {};
      await DB.clear('photos');
      for (const [id, v] of Object.entries(photos)) await DB.put('photos', id, v);
      await saveState();
      view = 'profil'; render(); toast('Sandaran berjaya dipulihkan');
    } catch (err) { toast('Gagal pulih: ' + err.message); }
  };

  // ================= Mula =================
  (async () => {
    try {
      await DB.open();
      const saved = await DB.get('kv', 'state');
      if (saved) {
        const fresh = DEFAULT_STATE();
        state = { profile: { ...fresh.profile, ...saved.profile }, entries: { ...fresh.entries, ...saved.entries } };
      }
      photos = await DB.all('photos');
      if (navigator.storage?.persist) navigator.storage.persist();
    } catch (err) {
      toast('Storan pelayar tidak tersedia: ' + err.message);
    }
    render();
  })();
})();
</script>
</body>
</html>
